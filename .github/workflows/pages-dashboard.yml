name: Publish Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "templates/dashboard.html"
      - "templates/email.html"
      - "templates/period_report.html"
      - "frontend/**"
      - "dashboard_builder.py"
      - "ai_briefing.py"
      - "analyzer.py"
      - "deterministic_risk.py"
      - "apply_context_rule_fixes.py"
      - "classification_normalizer.py"
      - "negative_watch.py"
      - "article_backfill.py"
      - "publish_report.py"
      - "sync_daily_archive_to_supabase.py"
      - "stock_collector.py"
      - "regulator_collector.py"
      - "refresh_regulator_releases.py"
      - "refresh_ga_competitor_intel.py"
      - "slack_notify.py"
      - "supabase_store.py"
      - "tests/test_analyzer.py"
      - "tests/test_deterministic_risk.py"
      - "tools/reclassify_deterministic.py"
      - "tests/test_context_rule_fixes.py"
      - "tests/test_dashboard_operations_snapshot.py"
      - "tests/test_negative_watch.py"
      - "tests/test_supabase_store_feedback.py"
      - "supabase/migrations/**"
      - ".backfill-requests/**"
      - ".github/workflows/pages-dashboard.yml"
      - ".github/workflows/ga-revenue-sync.yml"
  workflow_dispatch:
    inputs:
      refresh_external:
        description: "Refresh regulator, GA, and archive sync data before publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: news-monitor-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run release regression suite
        run: >-
          python -m unittest
          tests.test_deterministic_risk
          tests.test_analyzer
          tests.test_negative_watch
          tests.test_news_collector
          tests.test_supabase_store_feedback
          tests.test_context_rule_fixes
          tests.test_dashboard_operations_snapshot
          tests.test_dashboard_builder
          tests.test_dashboard_quality
          tests.test_dashboard_refresh
          tests.test_job_ledger
          tests.test_notification_link_quality
          tests.test_operational_schedules
          tests.test_public_report_links
          tests.test_report_window
          tests.test_schedule_guard
          tests.test_slack_notify
          tests.test_stock_collector

      - name: Refresh official regulator releases
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_external == true
        run: |
          timeout 180s python refresh_regulator_releases.py --days 14 --pages 10 || \
            echo "::warning::Regulator refresh did not finish; publishing with last successful data."
        env:
          FSS_API_AUTH_KEY: ${{ secrets.FSS_API_AUTH_KEY }}
          FSS_OPENAPI_AUTH_KEY: ${{ secrets.FSS_OPENAPI_AUTH_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh GA competitor intel
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_external == true
        run: |
          timeout 240s python refresh_ga_competitor_intel.py --stand-mm 202512 --top 10 --revenue-start-year 2021 --revenue-end-year 2025 || \
            echo "::warning::GA competitor refresh did not finish; publishing with last successful data."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Re-sync recent daily archives to Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_external == true
        run: |
          timeout 180s python sync_daily_archive_to_supabase.py --days 14 || \
            echo "::warning::Daily archive Supabase sync did not finish; dashboard publish will continue."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build rebuilt dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build static site from existing archives
        run: python publish_report.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY || secrets.DART }}
          DART_CORP_CODE: ${{ secrets.DART_CORP_CODE || secrets.INCAR_DART_CORP_CODE || '01013694' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_REPORT_MODEL || secrets.GEMINI_MODEL || secrets.GEMINI_EDGE_MODEL || 'gemini-2.5-pro' }}
          GEMINI_PRO_MODEL: ${{ secrets.GEMINI_PRO_MODEL || secrets.GEMINI_MODEL || secrets.GEMINI_EDGE_MODEL || 'gemini-2.5-pro' }}
          GEMINI_FLASH_MODEL: ${{ secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          GEMINI_CONTEXT_MODEL: ${{ secrets.GEMINI_CONTEXT_MODEL || secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          GEMINI_ISSUE_MODEL: ${{ secrets.GEMINI_ISSUE_MODEL || secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GROQ_ISSUE_MODEL: ${{ secrets.GROQ_ISSUE_MODEL || 'llama-3.3-70b-versatile' }}
          GROQ_MAX_ISSUE_SUMMARIES: ${{ secrets.GROQ_MAX_ISSUE_SUMMARIES || '20' }}
          AI_MAX_ISSUE_SUMMARIES: ${{ secrets.AI_MAX_ISSUE_SUMMARIES || '5' }}
          AI_ISSUE_SUMMARY_PROVIDER: gemini
          REQUIRE_DASHBOARD_HISTORY: "true"
          REQUIRE_DASHBOARD_QUALITY: "false"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
