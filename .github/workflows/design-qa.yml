name: Design QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dashboard URL to inspect"
        required: false
        default: "https://incarmarketing.github.io/news-monitor/dashboard.html"
  workflow_run:
    workflows:
      - Publish Dashboard
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: design-qa
  cancel-in-progress: true

jobs:
  visual-layout-check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Playwright runtime
        uses: actions/cache@v5
        with:
          path: .qa/playwright-runtime/node_modules
          key: playwright-runtime-1.56.1-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm install --prefix .qa/playwright-runtime --package-lock=false --no-save --no-audit --no-fund playwright@1.56.1

      - name: Inspect deployed dashboard
        env:
          DESIGN_QA_URL: ${{ github.event.inputs.url || 'https://incarmarketing.github.io/news-monitor/dashboard.html' }}
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.qa/playwright-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node frontend/scripts/design-qa.mjs

      - name: Verify report PDF downloads
        env:
          DESIGN_QA_URL: ${{ github.event.inputs.url || 'https://incarmarketing.github.io/news-monitor/dashboard.html' }}
          DESIGN_QA_OUT: .qa/design/report-download
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.qa/playwright-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node frontend/scripts/report-download-qa.mjs

      - name: Verify publisher analysis and management controls
        env:
          DESIGN_QA_URL: ${{ github.event.inputs.url || 'https://incarmarketing.github.io/news-monitor/dashboard.html' }}
          DESIGN_QA_OUT: .qa/design/management-analysis
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.qa/playwright-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node frontend/scripts/management-analysis-qa.mjs

      - name: Verify refresh layout stability
        env:
          DESIGN_QA_URL: ${{ github.event.inputs.url || 'https://incarmarketing.github.io/news-monitor/dashboard.html' }}
          DESIGN_QA_OUT: .qa/design/refresh-layout
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.qa/playwright-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node frontend/scripts/refresh-layout-qa.mjs

      - name: Verify related article drawer and complete pagination
        env:
          DESIGN_QA_URL: ${{ github.event.inputs.url || 'https://incarmarketing.github.io/news-monitor/dashboard.html' }}
          DESIGN_QA_OUT: .qa/design/media-issues
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.qa/playwright-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: node frontend/scripts/media-issues-qa.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-qa
          path: .qa/design

  pdf-content-check:
    needs: visual-layout-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PDF validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF validation dependency
        run: python -m pip install --disable-pip-version-check pypdf==7.1.1

      - name: Download browser verification results
        uses: actions/download-artifact@v7
        with:
          name: design-qa
          path: .qa/design

      - name: Verify exported text and CJK font embedding
        run: python tools/verify_report_pdfs.py .qa/design/report-download --check-notice-urls
