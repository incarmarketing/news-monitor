name: Sync External Cron

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "setup_cronjob_org.py"
      - "tests/test_operational_schedules.py"
      - "supabase/functions/trigger-news-collection/index.ts"
      - "supabase/migrations/*watchdog*schedule.sql"
      - ".github/workflows/sync-external-cron.yml"
  schedule:
    - cron: "10 18 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check cloud cron secrets
        id: secrets
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRON_DISPATCH_TOKEN: ${{ secrets.CRON_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CRONJOB_API_KEY" ] || [ -z "$CRON_DISPATCH_TOKEN" ]; then
            echo "::error::CRONJOB_API_KEY and CRON_DISPATCH_TOKEN are required to sync cron-job.org."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cron sync dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install requests python-dotenv

      - name: Verify operational schedules
        if: steps.secrets.outputs.ready == 'true'
        run: python -m unittest tests.test_operational_schedules

      - name: Sync cron-job.org jobs
        if: steps.secrets.outputs.ready == 'true'
        run: python setup_cronjob_org.py
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRON_DISPATCH_TOKEN: ${{ secrets.CRON_DISPATCH_TOKEN }}
