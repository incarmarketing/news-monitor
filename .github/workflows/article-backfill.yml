name: Article Backfill

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Article URLs to fetch and persist, separated by spaces or new lines"
        required: true
        type: string
      dry_run:
        description: "Fetch/classify only, without Supabase write"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Backfill articles
        run: python article_backfill.py
        env:
          BACKFILL_URLS: ${{ github.event.inputs.urls }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || 'https://moszekksbhprhevxdynb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTEXT_MODEL: ${{ secrets.GEMINI_CONTEXT_MODEL || secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          AI_CONTEXT_MAX_ARTICLES: "10"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          BACKFILL_DRY_RUN: ${{ github.event.inputs.dry_run }}
