name: Model Quality Compare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/model_quality_compare.py"
      - "summary_text.py"
      - "ai_fallback.py"
      - ".github/workflows/model-quality-compare.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compare Gemini Pro and Flash summary quality
        run: python tools/model_quality_compare.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || secrets.GEMINI_EDGE_MODEL || 'gemini-2.5-pro' }}
          GEMINI_PRO_MODEL: ${{ secrets.GEMINI_MODEL || secrets.GEMINI_EDGE_MODEL || 'gemini-2.5-pro' }}
          GEMINI_FLASH_MODEL: ${{ secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          GEMINI_TIMEOUT_SECONDS: "75"
          GEMINI_ISSUE_MAX_TOKENS: "4096"
          MODEL_QUALITY_STRICT: "0"

      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-compare
          path: artifacts/model-quality-compare
          retention-days: 7
